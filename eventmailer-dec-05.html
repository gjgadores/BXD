  }
  .cf { position: absolute; top: 0; display: block; opacity: 0; animation-name: cfall; animation-timing-function: ease-in; animation-iteration-count: 1; animation-fill-mode: both; }

  }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none !important; } }
  .cta { transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease; -webkit-tap-highlight-color: transparent; }
  .cta:active { transform: scale(0.96) !important; background-color: #2b2b2b !important; box-shadow: 0 4px 10px rgba(0,0,0,0.3) !important; }
  .cta:focus-visible { outline: 3px solid #000000; outline-offset: 3px; }
  @media only screen and (max-width: 480px) {
